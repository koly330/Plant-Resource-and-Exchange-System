<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant Care Tips</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="categories">

    <h2>🌿 Plant Care Tips</h2>

    <div class="category-container">

        <div class="category-card">
            <span>🌹</span>
            <h3>Rose</h3>
            <p>💧 Water regularly.</p>
            <p>☀️ Give enough sunlight.</p>
            <p>🌱 Use good soil.</p>
        </div>

        <div class="category-card">
            <span>🌵</span>
            <h3>Cactus</h3>
            <p>💧 Water less frequently.</p>
            <p>☀️ Keep in bright sunlight.</p>
        </div>

        <div class="category-card">
            <span>🌱</span>
            <h3>Aloe Vera</h3>
            <p>💧 Avoid overwatering.</p>
            <p>☀️ Give indirect sunlight.</p>
        </div>

        <div class="category-card">
            <span>🌻</span>
            <h3>Sunflower</h3>
            <p>☀️ Needs plenty of sunlight.</p>
            <p>💧 Water regularly.</p>
        </div>

    </div>

</section>

</body>
</html>
